# Supply-chain policy for Ravum (cargo-deny).
#
# Blocking in CI: advisories, licenses, duplicate versions, wildcard
# requirements and unknown sources are errors, not warnings. A temporary
# exception must be added here with a reason and an expiry in the PR.

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "allow"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
