# Supply-chain policy for Ravum (cargo-deny).
#
# Blocking in CI: advisories, licenses, duplicate versions, wildcard
# requirements and unknown sources are errors, not warnings. A temporary
# exception must be added here with a reason and an expiry in the PR.

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Cranelift (backend JIT, T15). Autorisée par le responsable le 2026-11-19
    # (V1-L1, docs/decision/DECISIONS-2026-11-19-V1.md). L'exception LLVM
    # n'ajoute que des droits par rapport à Apache-2.0.
    "Apache-2.0 WITH LLVM-exception",
    # audio_thread_priority (feature `rt-priority` de ravum-lang-audio,
    # désactivée par défaut). Autorisée par le responsable le 2026-11-20
    # (V1-L2, docs/decision/DECISIONS-2026-11-19-V1.md).
    "MPL-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "allow"
allow-workspace = true
# Doublons tirés uniquement par Cranelift (backend JIT, T15/T16), autorisés par
# le responsable le 2026-11-19 (V1-L2). Versions exactes : toute nouvelle
# version dupliquée reste refusée.
skip = [
    { crate = "hashbrown@0.14.5", reason = "cranelift-codegen 0.116 (V1-L2)" },
    { crate = "hashbrown@0.15.5", reason = "regalloc2 0.11 via cranelift (V1-L2)" },
    { crate = "bitflags@1.3.2", reason = "region 3 via cranelift-jit (V1-L2)" },
    { crate = "windows-sys@0.52.0", reason = "region 3 via cranelift-jit (V1-L2)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
