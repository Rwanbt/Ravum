[package]
name = "ravum-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Ravum continuous-development CLI (check/watch/status/patch/bench)."

[dependencies]
ravum-protocol = { workspace = true }
ravum-snapshot = { workspace = true }
ravum-rust-adapter = { workspace = true }
ravum-patch-host = { workspace = true }
ravum-coordinator = { workspace = true }
ravum-proof = { workspace = true }
ravum-dsp-harness = { workspace = true }
ravum-daemon = { workspace = true }
# Composition root L3.4 / COLLAB-4: `ravum collab-cycle` consumes the coordinator
# at *runtime* (proposals -> decisions -> AcceptedChange records), not only from
# integration tests. Workspace path dependency already built for the dev tests;
# no new external dependency.
ravum-workspace-coordinator = { workspace = true }
# MVP-0c L5.1: real inter-crate unit campaign + injected L1 oracle. Direct path
# dependencies keep the root workspace manifest untouched.
ravum-unit-graph = { path = "../ravum-unit-graph" }
ravum-collab-oracle = { path = "../ravum-collab-oracle" }
# MVP-0c L2.4 → produit : collecteur de propositions pour `ravum batch-check`.
ravum-batch = { path = "../ravum-batch" }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "ravum"
path = "src/main.rs"

