[package]
name = "ravum-lang-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "ravum-lang: Ravum language toolchain (init/check/build/run/test/fmt/...)"

[[bin]]
name = "ravum-lang"
path = "src/main.rs"

[dependencies]
ravum-lang-syntax = { workspace = true }
ravum-lang-sema = { workspace = true }
ravum-lang-codegen = { workspace = true }
ravum-lang-lsp = { workspace = true }
# Development backend (T15/T16): `watch --backend jit`.
ravum-lang-ir = { path = "../ravum-lang-ir" }
ravum-lang-jit = { path = "../ravum-lang-jit" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Reference interpreter, compared to the backend (core-machine.md §8, O10).
# A dev-dependency only: the machine itself depends on no compiler crate.
ravum-core-machine = { path = "../ravum-core-machine" }
# DSP block end-to-end test (RFC-E11-DSP-BLOCK): the real host loads the
# `cdylib` built from `.rv`; the harness counts allocations on the callback.
ravum-protocol = { workspace = true }
ravum-patch-host = { workspace = true }
ravum-dsp-harness = { workspace = true }
