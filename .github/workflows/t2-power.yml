name: T2 power evidence for array descents

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/t2-power.yml
      - tools/t2-power/**

permissions:
  contents: read

jobs:
  inverse:
    name: Array descent inverse ${{ matrix.form }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        form: [10, 11, 12, 13]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
      - name: Replay the inverse in a disposable checkout
        env:
          FORM: ${{ matrix.form }}
          CARGO_TERM_COLOR: never
        run: bash tools/t2-power/replay-array-descent.sh "$FORM" 2000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-power-form-${{ matrix.form }}
          path: target/t2-power/${{ matrix.form }}/
