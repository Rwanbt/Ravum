name: Mutation evidence (weekly, non-blocking gate)

# Purpose: stop the mutation campaign from being a one-shot manual measurement.
# `docs/qualification/MUTATION-EQUIVALENCE.md` §7 records 212 mutants / 153
# killed on a TARGETED scope (three function sets of `own.rs`, `resolve.rs`,
# `typeck.rs`), and §9 the 2026-11-11 local campaign (183 / 150 / 24 / 9). The
# first CI run (2026-11-12, run 43326219422) reproduced §9's totals exactly;
# its summary step had a schema bug (it read the report as a list), fixed here,
# and the survivors are now printed by name.
#
# Campaign 4 (added 2026-11-14) closes the R8 hole named in
# `PRODUCTION-READINESS.md`: mutation was never run on `codegen/emit.rs`. The
# targeted functions are the ones that decide ownership/move behaviour and the
# extern-wrapper emission, not the whole file: a mutation score over the whole
# crate would still say nothing about the rest (MUTATION-EQUIVALENCE.md §1).
#
# Scope and honesty rules:
#   * the same targeted `-F` filters are used, so the numbers stay comparable
#     with the published table;
#   * this job is EVIDENCE, not a release gate: surviving mutants are expected
#     and triaged in MUTATION-EQUIVALENCE.md §7.1-§7.4. The job therefore does
#     not fail on survivors; it fails only when the campaign itself could not
#     run (missing report, crashed tool), which is a real infrastructure defect;
#   * no mutation score is published for the whole crate: a targeted score says
#     nothing about the rest (MUTATION-EQUIVALENCE.md §1).
#
# The report is uploaded as an artifact; a maintainer diffs it against the
# published table and records any new survivor with a reason.

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 03:17 UTC (off the top of the hour to avoid the CI rush).
    - cron: '17 3 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'

jobs:
  mutation:
    name: cargo-mutants on the three targeted function sets
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable pinned to 1.95.0)
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install cargo-mutants 27.1.0
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-mutants-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutants-

      # `--no-shuffle` keeps the reported order stable; `-j 8` matches the
      # published campaign. The `--file`/`-F` pairs are the exact ones recorded
      # in MUTATION-EQUIVALENCE.md §7; changing them requires updating the doc.
      #
      # `|| true` + `continue-on-error` are deliberate: cargo-mutants exits
      # non-zero when mutants survive, and survivors are triaged, not fatal.
      # The next step still fails the job when a report is missing entirely.
      - name: own.rs (borrow bookkeeping)
        continue-on-error: true
        run: |
          mkdir -p target/mutants/own
          cargo mutants --no-shuffle -j 8 \
            --file crates/ravum-lang-sema/src/own.rs \
            -F 'borrow_place|check_availability|place_mutability' \
            2>&1 | tee target/mutants/own/campaign.log || true
          if [ -d mutants.out ]; then mv mutants.out target/mutants/own/; fi

      - name: resolve.rs (imports, type paths, Copy)
        continue-on-error: true
        run: |
          mkdir -p target/mutants/resolve
          cargo mutants --no-shuffle -j 8 \
            --file crates/ravum-lang-sema/src/resolve.rs \
            -F 'resolve_type_path|resolve_imports|resolve_use_target|type_is_copy|nominal_is_copy' \
            2>&1 | tee target/mutants/resolve/campaign.log || true
          if [ -d mutants.out ]; then mv mutants.out target/mutants/resolve/; fi

      - name: typeck.rs (patterns, consts, struct literals, for)
        continue-on-error: true
        run: |
          mkdir -p target/mutants/typeck
          cargo mutants --no-shuffle -j 8 \
            --file crates/ravum-lang-sema/src/typeck.rs \
            -F 'check_struct_lit|check_variant_call|check_for|check_lit_pattern|cover_pattern|negative_value_fits|pattern_contains_float|check_const_expr' \
            2>&1 | tee target/mutants/typeck/campaign.log || true
          if [ -d mutants.out ]; then mv mutants.out target/mutants/typeck/; fi

      # emit.rs decides the shape of the generated Rust: which values move, what
      # copy semantics apply, how an extern wrapper is emitted. Its local move
      # logic was removed in T7 (OwnFacts guard) and is the exact kind of code a
      # "covered" giant match can hide a bug in. Targeted, not whole-file.
      - name: emit.rs (move/repr decisions and extern wrapper emission)
        continue-on-error: true
        run: |
          mkdir -p target/mutants/emit
          cargo mutants --no-shuffle -j 8 \
            --file crates/ravum-lang-codegen/src/emit.rs \
            -F 'builtin_method_moves_receiver|is_copy_type|is_owned_position|plan_array_moves|verify_ownership_facts|emit_extern_block' \
            2>&1 | tee target/mutants/emit/campaign.log || true
          if [ -d mutants.out ]; then mv mutants.out target/mutants/emit/; fi

      # A campaign that produced no report is an infrastructure failure, not a
      # mutation result: there is nothing to triage, so the job must fail.
      - name: Verify that every campaign produced a report
        run: |
          set -e
          missing=0
          for name in own resolve typeck emit; do
            if [ ! -f "target/mutants/$name/mutants.out/outcomes.json" ]; then
              echo "::error::campaign $name produced no mutants.out/outcomes.json (see its log)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Summarize outcomes (never hides survivors)
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          for name in ("own", "resolve", "typeck", "emit"):
              path = pathlib.Path(f"target/mutants/{name}/mutants.out/outcomes.json")
              if not path.is_file():
                  print(f"{name}: NO REPORT")
                  continue
              report = json.loads(path.read_text())
              # cargo-mutants 27.x writes an object:
              # {"outcomes": [...], "total_mutants": N, "missed": M, ...}.
              # Iterating the object itself yields its string keys, which is the
              # defect the first run hit (AttributeError: 'str' has no 'get').
              items = report.get("outcomes", []) if isinstance(report, dict) else report
              total = report.get("total_mutants", len(items)) if isinstance(report, dict) else len(items)
              counts = {}
              missed = []
              for item in items:
                  key = (item.get("summary") or item.get("outcome") or "unknown") if isinstance(item, dict) else str(item)
                  counts[key] = counts.get(key, 0) + 1
                  if key == "MissedMutant" and isinstance(item, dict):
                      scenario = item.get("scenario", {})
                      mutant = scenario.get("Mutant", {}) if isinstance(scenario, dict) else {}
                      missed.append(mutant.get("name", str(scenario)))
              print(f"{name}: total={total} counts={counts}")
              # Survivors are triaged, never hidden: name every one of them.
              for scenario in missed:
                  print(f"{name}: MISSED {scenario}")
          PY

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-targeted
          path: target/mutants
          if-no-files-found: warn
          retention-days: 90
