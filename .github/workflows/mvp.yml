name: MVP product checks (build, tests, demos)

# This workflow qualifies the MVP-0a code: it builds, runs the test suite and
# executes the two demonstrations. It does NOT qualify a compiler, a proof, an
# ABI stability guarantee, audio real-time behaviour, or any release.

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  mvp:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Show toolchain
        run: |
          rustc -vV
          cargo --version
          git --version

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-mvp-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mvp-

      - name: Build workspace
        run: cargo build --workspace

      # Serialized on purpose: the M1 tests build real native libraries and the
      # reference machine has little memory headroom. Parallelism here would
      # measure the runner's RAM, not the code.
      - name: Test workspace
        run: cargo test --workspace -- --test-threads=1

      - name: Demo M1 - hot patch in a living process
        run: powershell -ExecutionPolicy Bypass -File scripts/demo-m1.ps1

      - name: Demo COLLAB-1 - multi-agent proposals and single Git writer
        run: powershell -ExecutionPolicy Bypass -File scripts/demo-collab.ps1 -Commit

      - name: Prove a bounded obligation (M2)
        run: cargo run -q --bin ravum -- prove fixtures/proof/positive.rs --claim finite --inputs 0,1,2.5,1000000 --ledger evidence/local/ci-ledger.jsonl

      # The violated obligation must exit 1: a green step here would mean the gate
      # accepts a counterexample, which is the one failure mode that matters.
      - name: Refuse a violated obligation (M2)
        shell: pwsh
        run: |
          cargo run -q --bin ravum -- prove fixtures/proof/negative.rs --claim non-negative --inputs 0,1,2,3 --ledger evidence/local/ci-ledger.jsonl --json
          if ($LASTEXITCODE -ne 1) {
            Write-Error "expected exit code 1 for a violated obligation, got $LASTEXITCODE"
            exit 1
          }
          Write-Host "violated obligation correctly refused (exit 1)"
          exit 0

      - name: Demo DSP - block processing with a hot swap (M3)
        run: |
          cargo run -q --bin ravum -- dsp fixtures/dsp/iir_v1.rs --next fixtures/dsp/iir_v2.rs --blocks 200
          cargo run -q --bin ravum -- dsp fixtures/dsp/gain_v1.rs --next fixtures/dsp/gain_v2.rs --blocks 200

      - name: Demo M4 - UI + API + SQLite end to end
        run: powershell -ExecutionPolicy Bypass -File scripts/demo-m4.ps1

      # Browser E2E: the real UI JavaScript is executed in headless Chromium/Edge and the
      # displayed DOM is asserted (CDP pilot, zero npm dependency). windows-latest ships
      # Edge, so -RequireBrowser turns "no browser found" into a failure instead of a
      # silent green; exit code 2 (explicit SKIP) can only happen outside this step.
      - name: Setup Node.js for the browser E2E
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Browser E2E - real Chromium/Edge via CDP (no npm dependency)
        run: powershell -ExecutionPolicy Bypass -File scripts/demo-m4-browser.ps1 -RequireBrowser -Screenshots

      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          path: target/ravum/browser-e2e
          if-no-files-found: warn
          retention-days: 7

      - name: Measure the loop (informational, not a performance gate)
        run: |
          cargo run -q --bin ravum -- bench fixtures/calculator/v1.rs fixtures/calculator/v2.rs --iterations 6 --out evidence/local/ci-bench.json

      - name: Scope notice
        run: |
          echo "Product checks only: no proof, no release, no real-time qualification, no ABI stability claim."
