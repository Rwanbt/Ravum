# Banc d'essai U1-B (UI-D8) : workspace SÉPARÉ du workspace Ravum, pour que
# les bibliothèques candidates n'entrent dans aucun crate Ravum avant la
# décision du responsable (UI-D4). Versions épinglées exactement.
[workspace]
members = ["headless", "reactivity", "render-cpu", "footprint/egui", "footprint/slint", "footprint/modular", "footprint/blitz", "round3/common", "round3/egui", "round3/slint", "round3/modular", "ui-core", "ui-shell"]
resolver = "2"

[profile.release]
debug = false
