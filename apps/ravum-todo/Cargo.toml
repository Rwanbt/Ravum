[package]
name = "ravum-todo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "M4 reference application: HTTP API, SQLite storage and a static web UI."

[dependencies]
ravum-todo-core = { workspace = true }
ravum-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }

[[bin]]
name = "ravum-todo"
path = "src/main.rs"
