[workspace]
resolver = "2"
members = [
  "crates/ravum-protocol",
  "crates/ravum-snapshot",
  "crates/ravum-rust-adapter",
  "crates/ravum-patch-host",
  "crates/ravum-coordinator",
  "crates/ravum-workspace-coordinator",
  "crates/ravum-cli",
  "apps/ravum-demo-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libloading = "0.8"

ravum-protocol = { path = "crates/ravum-protocol" }
ravum-snapshot = { path = "crates/ravum-snapshot" }
ravum-rust-adapter = { path = "crates/ravum-rust-adapter" }
ravum-patch-host = { path = "crates/ravum-patch-host" }
ravum-coordinator = { path = "crates/ravum-coordinator" }
ravum-workspace-coordinator = { path = "crates/ravum-workspace-coordinator" }

# Keep debug info minimal: the reference machine has ~16 Go RAM and the
# permanent-build pipeline measures wall time, so link time matters.
[profile.dev]
debug = 1
incremental = false
